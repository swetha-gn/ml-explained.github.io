<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/waveguide.css' | relative_url }}">
  </head>
  <body class="wg-body">
    <header class="wg-nav" aria-label="Primary navigation">
      <a class="wg-brand" href="{{ '/portfolio/' | relative_url }}" aria-label="Open Swetha Gendlur Nagarajan portfolio">
        <strong>Swetha</strong> Gendlur Nagarajan
      </a>
      <nav class="wg-nav__links">
        <a class="{% if page.nav == 'about' %}is-active{% endif %}" href="{{ '/about/' | relative_url }}">about</a>
        <a class="{% if page.nav == 'blog' %}is-active{% endif %}" href="{{ '/blog/' | relative_url }}">blog</a>
        <a class="{% if page.nav == 'publications' %}is-active{% endif %}" href="{{ '/publications/' | relative_url }}">publications</a>
        <a class="{% if page.nav == 'cv' %}is-active{% endif %}" href="{{ '/cv/' | relative_url }}">CV</a>
      </nav>
    </header>

    <main class="wg-main">
      {{ content }}
    </main>
  </body>
</html>
